# Sentinel-Logs SIEM - Docker Compose Configuration
# 
# ⚠️  SECURITY NOTES FOR PRODUCTION:
# 1. Bind services to localhost only (127.0.0.1) instead of 0.0.0.0
# 2. Use strong passwords in .env file
# 3. Enable firewall rules to restrict access
# 4. Use proper SSL certificates (not self-signed)
# 5. Consider using Docker secrets for sensitive data
#
# For production deployment, modify port bindings:
#   - "3100:3100"  →  "127.0.0.1:3100:3100"  (Loki - internal only)
#   - "5432:5432"  →  "127.0.0.1:5432:5432"  (PostgreSQL - internal only)
#   - "3000:3000"  →  "127.0.0.1:3000:3000"  (Grafana - internal only)

services:
  # ── Frontend builder ─────────────────────────────────────
  # Builds the React app inside Docker on every `docker-compose up --build`.
  # The compiled assets land in the named `frontend_dist` volume, which is
  # mounted read-only into both nginx (serves them) and backend (SPA fallback).
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
      - frontend_dist:/app/dist
    command: sh -c "npm ci && npm run build"
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: always

  backend:
    build: ./backend
    expose:
      - "4000"
    ports:
      - "514:514/udp"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - frontend_dist:/app/frontend/dist:ro
    depends_on:
      - loki
      - postgres

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    depends_on:
      - loki
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  grafana_data:
  frontend_dist:
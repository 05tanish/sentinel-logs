# Alertmanager Configuration
# ⚠️ IMPORTANT: Configure these environment variables before use:
# - SMTP_HOST (default: localhost:587)
# - SMTP_FROM (default: siem-alerts@yourcompany.com)
# - SMTP_USERNAME (required for email notifications)
# - SMTP_PASSWORD (required for email notifications)
#
# For production, use environment variables or external secrets management

global:
  smtp_smarthost: 'localhost:587'  # Change to your SMTP server
  smtp_from: 'siem-alerts@yourcompany.com'  # Change to your email
  # IMPORTANT: Set these via environment variables in production:
  # smtp_auth_username: Set via SMTP_USERNAME env var
  # smtp_auth_password: Set via SMTP_PASSWORD env var
  # 
  # For testing, you can uncomment and set these (NOT for production):
  # smtp_auth_username: 'your-email@yourcompany.com'
  # smtp_auth_password: 'your-app-password'

# Alert routing
route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 30m
    
    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 2h
    
    # SIEM-specific routing
    - match:
        service: log-ingestion
      receiver: 'siem-ops-team'
    
    - match:
        service: authentication
      receiver: 'security-team'

# Notification channels
receivers:
  # Default webhook
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://backend:4000/api/alerts/webhook'
        send_resolved: true

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'siem-admin@yourcompany.com'
        subject: '🚨 CRITICAL SIEM Alert: {{ .GroupLabels.alertname }}'
        body: |
          Alert: {{ .GroupLabels.alertname }}
          Severity: {{ .CommonLabels.severity }}
          Service: {{ .CommonLabels.service }}
          
          {{ range .Alerts }}
          Description: {{ .Annotations.description }}
          {{ end }}
    
    webhook_configs:
      - url: 'http://backend:4000/api/alerts/webhook'
        send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'siem-team@yourcompany.com'
        subject: '⚠️ SIEM Warning: {{ .GroupLabels.alertname }}'
        body: |
          Alert: {{ .GroupLabels.alertname }}
          Severity: {{ .CommonLabels.severity }}
          
          {{ range .Alerts }}
          Description: {{ .Annotations.description }}
          {{ end }}

  # Operations team
  - name: 'siem-ops-team'
    email_configs:
      - to: 'siem-ops@yourcompany.com'
        subject: 'SIEM Operations Alert: {{ .GroupLabels.alertname }}'

  # Security team
  - name: 'security-team'
    email_configs:
      - to: 'security@yourcompany.com'
        subject: '🔒 Security Alert: {{ .GroupLabels.alertname }}'

# Prevent alert spam
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
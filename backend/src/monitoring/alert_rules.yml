# SIEM Alert Rules
groups:
  - name: siem_alerts
    rules:
      # High error rate detection
      - alert: HighErrorRate
        expr: rate(siem_http_requests_total{status_code=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: siem-backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for the last 5 minutes"

      # Slow response time detection
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(siem_http_request_duration_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          service: siem-backend
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}ms"

      # Database connection pool issues
      - alert: DatabasePoolExhaustion
        expr: siem_database_pool_connections{status="active"} / (siem_database_pool_connections{status="active"} + siem_database_pool_connections{status="idle"}) > 0.9
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of database connections are active"

      # Authentication failure spike
      - alert: HighAuthFailureRate
        expr: rate(siem_auth_attempts_total{status="failure"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: authentication
        annotations:
          summary: "High authentication failure rate"
          description: "{{ $value }} authentication failures per second"

      # Log ingestion stopped
      - alert: NoLogsIngested
        expr: rate(siem_logs_ingested_total[10m]) == 0
        for: 5m
        labels:
          severity: critical
          service: log-ingestion
        annotations:
          summary: "No logs being ingested"
          description: "No logs have been ingested for the last 10 minutes"

      # Critical alert spike
      - alert: HighCriticalAlertRate
        expr: rate(siem_alerts_generated_total{severity="CRITICAL"}[5m]) > 2
        for: 1m
        labels:
          severity: critical
          service: alerting
        annotations:
          summary: "High rate of critical alerts"
          description: "{{ $value }} critical alerts per second being generated"

      # Agent disconnection
      - alert: AgentDisconnected
        expr: siem_active_agents < 1
        for: 2m
        labels:
          severity: warning
          service: agents
        annotations:
          summary: "SIEM agents disconnected"
          description: "Only {{ $value }} agents are currently active"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (siem_nodejs_process_resident_memory_bytes / siem_nodejs_os_totalmem_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          service: siem-backend
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

  - name: infrastructure_alerts
    rules:
      # Service availability
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      # CPU usage monitoring
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      # Disk space monitoring
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is {{ $value }}% full"
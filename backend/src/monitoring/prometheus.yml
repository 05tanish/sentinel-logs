# Prometheus Configuration for SIEM System
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'siem-monitor'
    environment: 'production'

# Alert rules location
rule_files:
  - "alert_rules.yml"

# Scrape targets
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # SIEM Backend API metrics
  - job_name: 'siem-backend'
    static_configs:
      - targets: ['backend:4000']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # System metrics from node-exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Database metrics from postgres-exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

# Data retention and storage
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093